[project]
name = "pavlov"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["jax", "optax", "numpy", "scipy", "pandas", "matplotlib", "pyyaml"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
